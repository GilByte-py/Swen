
<!DOCTYPE html>
<html>
<head>
    <title>Chefly</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            text-align: center;
        }

        .profile {
            text-decoration: none;
            color: black;
            background: #eee;
            padding: 10px;
            border-radius: 50%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .item {
            text-decoration: none;
            color: black;
        }

        .item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item p {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Chefly</h1>
    <a class="profile" href="profile.html">👤</a>
</header>

<div class="grid">

    <a class="item" href="taco.html">
        <img src="https://www.tasteofhome.com/wp-content/uploads/2026/08/Dinner-Recipes-That-Will-Feed-a-Crowd_FT26_281258_AC_0109_9_FT.jpg">
        <p>Tacos - Chef: John Doe</p>
    </a>
    <a class="item" href="burger.html">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
        <p>Burgers - Chef: Jane Smith</p>
    </a>
    <a class="item" href="pizza.html">
        <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498">
        <p>Pizza - Chef: Bob Johnson</p>
    </a>
    <a class="item" href="chicken.html">
        <img src="https://images.unsplash.com/photo-1562967914-608f82629710">
        <p>Chicken - Chef: Alice Brown</p>
    </a>
    <a class="item" href="salad.html">
        <img src="https://images.unsplash.com/photo-1550304943-4f24f54ddde9">
        <p>Salad - Chef: Charlie Wilson</p>
    </a>
    <a class="item" href="spaghetti.html">
        <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141">
        <p>Spaghetti - Chef: David Davis</p>
    </a>

</div>

</body>
</html>
